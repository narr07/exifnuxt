name: Release Build

on:
  push:
    branches:
      - release
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest # Arm based macs (Apple Silicon)
            args: --target aarch64-apple-darwin
          - platform: macos-latest # Intel based macs
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Install frontend dependencies
        run: bun install

      - name: Build and Publish Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: ExifNuxt v__VERSION__
          releaseBody: |
            ### ExifNuxt v__VERSION__

            Editor metadata EXIF foto desktop untuk fotografer: edit per file atau massal, bersihkan data privasi, dan salin grup field.

            #### Catatan Pemasangan:
            - **Windows**: Jalankan installer `.exe` atau jalankan binary portable.
            - **macOS**: Buka file `.dmg`. Jika muncul peringatan keamanan macOS Gatekeeper, jalankan:
              ```bash
              xattr -c /Applications/ExifNuxt.app
              ```
            - **Linux**: Tersedia paket `.deb` dan `.AppImage`.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
